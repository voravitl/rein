name: release
# Push a tag v<version> that matches every package and plugin manifest; the plugin's SessionStart installer
# downloads rein-<os>-<arch> from this release (checked against SHA256SUMS) on machines without Go.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tag matches package and plugin versions
        run: sh scripts/check-version-consistency.sh "$GITHUB_REF_NAME"
      - run: go test ./...
      - run: VERSION="${GITHUB_REF_NAME#v}" sh scripts/build.sh
      - run: VERSION="${GITHUB_REF_NAME#v}" sh scripts/package-crux.sh
      - name: append the Crux asset digest
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then sha256sum crux-*.tgz >> SHA256SUMS; else shasum -a 256 crux-*.tgz >> SHA256SUMS; fi
      - run: gh release create "$GITHUB_REF_NAME" dist/rein-* dist/crux-*.tgz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
