name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - name: build and smoke-test the hook
        shell: bash
        run: |
          go build -o bin/rein$([ "$RUNNER_OS" = Windows ] && echo .exe) ./cmd/rein
          bin/rein version
          # outside a worker the hook must stay silent and exit 0
          out=$(echo '{"hook_event_name":"PreToolUse","tool_name":"Bash","cwd":".","tool_input":{"command":"git push"}}' | bin/rein hook)
          test -z "$out"
      - name: plugin scripts parse
        if: runner.os != 'Windows'
        run: |
          for f in scripts/*.sh examples/pack/gates/*.sh; do sh -n "$f"; done
          for f in skills/worktree-pipeline/scripts/*.sh; do bash -n "$f"; done
          python3 -m py_compile skills/worktree-pipeline/scripts/*.py
          for f in .claude-plugin/*.json hooks/hooks.json examples/*.json; do python3 -m json.tool "$f" >/dev/null; done
      - name: cleanup regression tests
        if: runner.os != 'Windows'
        run: python3 -B -m unittest discover -s skills/worktree-pipeline/scripts -p 'test*cleanup*.py'
      - name: advisor routing regression tests
        if: runner.os != 'Windows'
        run: python3 -B -m unittest discover -s skills/worktree-pipeline/scripts -p 'test_advise_routing.py'
      - name: SessionStart installer builds once and is idempotent
        if: runner.os != 'Windows'
        run: |
          export CLAUDE_PLUGIN_ROOT="$PWD" CLAUDE_PLUGIN_DATA="$RUNNER_TEMP/rein-data"
          sh scripts/ensure-binary.sh | grep -q 'guard binary ready'
          test -z "$(sh scripts/ensure-binary.sh)"
          "$CLAUDE_PLUGIN_DATA/bin/rein" version
